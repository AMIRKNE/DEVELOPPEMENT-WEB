<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6fb">
    <title>Changeur de couleurs</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Color Changer</h1>
        <p class="intro">Cliquez sur le bouton pour découvrir une nouvelle couleur.</p>
        <div id="color-box" role="img" aria-label="Boîte de couleur, couleur actuelle : #6c63ff"></div>
        <p id="color-value" aria-live="polite">#6C63FF</p>
        <button id="change-color-btn" type="button">Change Color</button>
    </main>
</body>
</html>
